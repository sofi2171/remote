<!DOCTYPE html>\n<html>\n<head>\n    <title>TURN Server Test</title>\n</head>\n<body>\n    <h1>TURN Server Test</h1>\n    <button onclick=\"testTurn()\">Test TURN Server</button>\n    <div id=\"result\"></div>\n\n    <script>\n        async function testTurn() {\n            const result = document.getElementById('result');\n            result.innerHTML = 'Testing...';\n            \n            const pc = new RTCPeerConnection({\n                iceServers: [{\n                    urls: 'turn:127.0.0.1:3478',\n                    username: 'sufian',\n                    credential: 'sufian123'\n                }]\n            });\n            \n            let hasRelay = false;\n            \n            pc.onicecandidate = (e) => {\n                if (e.candidate && e.candidate.candidate.includes('relay')) {\n                    hasRelay = true;\n                    result.innerHTML = '✅ TURN Server Working!';\n                }\n            };\n            \n            const offer = await pc.createOffer();\n            await pc.setLocalDescription(offer);\n            \n            setTimeout(() => {\n                if (!hasRelay) {\n                    result.innerHTML = '❌ TURN Server Not Working';\n                }\n                pc.close();\n            }, 3000);\n        }\n    </script>\n</body>\n</html>
